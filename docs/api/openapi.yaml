openapi: 3.1.0
info:
  title: TaskFlow API
  version: 0.1.0
  description: >-
    Initial contract for TaskFlow V1. Permission details are defined in
    ../architecture/permissions.md. All timestamps are ISO-8601 instants;
    their display and input interpretation follow the V1 date policy.
  license:
    name: License to be determined
    identifier: LicenseRef-TBD
servers:
  - url: https://api.taskflow.invalid
    description: Reserved placeholder; replace when the deployment host is selected.
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: Local credentials, Google OAuth, token refresh, logout, and password recovery.
  - name: Account
    description: Current-user profile and account lifecycle operations.
  - name: Boards
    description: Board metadata, tags, and the user's accessible boards.
  - name: Members and invitations
    description: Board membership, role administration, and registered-user invitations.
  - name: Columns
    description: Board column creation, editing, deletion, and ordering.
  - name: Tasks
    description: Task queries, updates, assignment, deletion, and movement.
  - name: Subtasks
    description: Subtask creation, completion, editing, and deletion.
  - name: Comments
    description: Read and add task comments.
  - name: Calendar
    description: Due-date view over tasks from accessible boards.
  - name: Notifications
    description: Persisted in-app notifications and read state.
  - name: Activity
    description: Board-local activity history.
paths:
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a local account
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; refresh cookie is set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate with username or email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; refresh cookie is set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate refresh token and issue a new access token
      operationId: refreshSession
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Refresh cookie is rotated.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current access and refresh tokens
      operationId: logout
      security:
        - bearerAuth: []
          refreshCookie: []
      responses:
        '204':
          description: Tokens revoked and refresh cookie cleared.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Expired refresh cookie.
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'

  /api/v1/auth/password-reset-requests:
    post:
      tags: [Authentication]
      summary: Request a password-reset link
      operationId: requestPasswordReset
      description: >-
        Always returns the same accepted response, whether or not the email
        belongs to a local-password account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Request accepted; no account-existence information is disclosed.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '429':
          $ref: '#/components/responses/RateLimitProblem'

  /api/v1/auth/password-resets:
    post:
      tags: [Authentication]
      summary: Set a new password using a reset token
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetSubmit'
      responses:
        '204':
          description: Password changed; outstanding refresh sessions are revoked.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '410':
          description: Reset token is invalid, expired, or already consumed.

  /api/v1/users/me:
    get:
      tags: [Account]
      summary: Get the current user's profile
      operationId: getMyProfile
      responses:
        '200':
          description: Current profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
    patch:
      tags: [Account]
      summary: Update profile fields
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
    delete:
      tags: [Account]
      summary: Delete the current account
      operationId: deleteMyAccount
      description: Rejected while the user owns unresolved collaborative boards.
      responses:
        '204':
          description: Account deleted.
        '409':
          description: Account cannot be deleted until owned collaborative boards are resolved.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'

  /api/v1/users/me/password:
    put:
      tags: [Account]
      summary: Change password while authenticated
      operationId: changeMyPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'

  /api/v1/boards:
    get:
      tags: [Boards]
      summary: List boards accessible to the current user
      operationId: listBoards
      parameters:
        - name: mode
          in: query
          schema:
            $ref: '#/components/schemas/BoardMode'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Accessible boards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardPage'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
    post:
      tags: [Boards]
      summary: Create a personal or collaborative board
      operationId: createBoard
      description: The authenticated creator is inserted as the single Owner in the same transaction. New boards receive Backlog, To Do, In Progress, and Done columns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoardRequest'
      responses:
        '201':
          description: Board created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardDetail'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'

  /api/v1/boards/{boardId}:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      tags: [Boards]
      summary: Get a board and its initial view data
      operationId: getBoard
      responses:
        '200':
          description: Board details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
    patch:
      tags: [Boards]
      summary: Update board metadata or convert personal to collaborative
      operationId: updateBoard
      description: Owner-only operation. V1 supports conversion to collaborative; no Workspace is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardPatch'
      responses:
        '200':
          description: Board updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardDetail'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /api/v1/boards/{boardId}/members:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      tags: [Members and invitations]
      summary: List board members
      operationId: listBoardMembers
      responses:
        '200':
          description: Board members and their board-scoped roles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardMember'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /api/v1/boards/{boardId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/BoardId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Members and invitations]
      summary: Change the role of a non-Owner member
      operationId: changeBoardMemberRole
      description: Owner/Admin only. The Owner role cannot be assigned or changed through this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeMemberRoleRequest'
      responses:
        '200':
          description: Member role changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardMember'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
    delete:
      tags: [Members and invitations]
      summary: Remove a non-Owner member
      operationId: removeBoardMember
      description: Owner/Admin only. Removing the Owner is not supported in V1.
      responses:
        '204':
          description: Member removed.
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /api/v1/boards/{boardId}/invitations:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    post:
      tags: [Members and invitations]
      summary: Invite a registered user by email
      operationId: createBoardInvitation
      description: Unknown or invalid addresses produce no invitation. Invitation acceptance is required before board access is granted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Pending invitation created and email queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          description: No registered user matches the email, or the board is not visible.
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /api/v1/invitations:
    get:
      tags: [Members and invitations]
      summary: List pending invitations for the current user
      operationId: listMyInvitations
      responses:
        '200':
          description: Invitations addressed to the current user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'

  /api/v1/invitations/{invitationId}/accept:
    post:
      tags: [Members and invitations]
      summary: Accept a pending invitation addressed to the current user
      operationId: acceptInvitation
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: Invitation accepted and membership created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardMember'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '410':
          description: Invitation expired, revoked, or already consumed.

  /api/v1/invitations/{invitationId}/decline:
    post:
      tags: [Members and invitations]
      summary: Decline a pending invitation addressed to the current user
      operationId: declineInvitation
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '204':
          description: Invitation declined.
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '410':
          description: Invitation expired, revoked, or already consumed.

  /api/v1/boards/{boardId}/columns:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      tags: [Columns]
      summary: List ordered columns for a board
      operationId: listBoardColumns
      responses:
        '200':
          description: Ordered board columns.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardColumn'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
    post:
      tags: [Columns]
      summary: Create a board column
      operationId: createBoardColumn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateColumnRequest'
      responses:
        '201':
          description: Column created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardColumn'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'

  /api/v1/boards/{boardId}/columns/{columnId}:
    parameters:
      - $ref: '#/components/parameters/BoardId'
      - $ref: '#/components/parameters/ColumnId'
    patch:
      tags: [Columns]
      summary: Rename a board column
      operationId: updateBoardColumn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateColumnRequest'
      responses:
        '200':
          description: Column updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardColumn'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
    delete:
      tags: [Columns]
      summary: Delete an empty board column
      operationId: deleteBoardColumn
      description: Move its tasks elsewhere before deleting; non-empty columns return 409.
      responses:
        '204':
          description: Column deleted.
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /api/v1/boards/{boardId}/columns/order:
    post:
      tags: [Columns]
      summary: Reorder board columns
      operationId: reorderBoardColumns
      parameters:
        - $ref: '#/components/parameters/BoardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderColumnsRequest'
      responses:
        '200':
          description: Columns reordered.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardColumn'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /api/v1/boards/{boardId}/tags:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      tags: [Boards]
      summary: List tags defined for a board
      operationId: listBoardTags
      responses:
        '200':
          description: Board tags.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
    post:
      tags: [Boards]
      summary: Create a tag definition for a board
      operationId: createBoardTag
      description: Owner/Admin only. Members may apply existing tags to their assigned tasks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: Board tag created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'

  /api/v1/boards/{boardId}/tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/BoardId'
      - $ref: '#/components/parameters/TagId'
    patch:
      tags: [Boards]
      summary: Rename or recolor a board tag
      operationId: updateBoardTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagPatch'
      responses:
        '200':
          description: Tag updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
    delete:
      tags: [Boards]
      summary: Delete a board tag definition
      operationId: deleteBoardTag
      description: Owner/Admin only. Removes the tag association from tasks on this board.
      responses:
        '204':
          description: Tag deleted.
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /api/v1/boards/{boardId}/tasks:
    parameters:
      - $ref: '#/components/parameters/BoardId'
    get:
      tags: [Tasks]
      summary: List visible tasks on a board
      operationId: listBoardTasks
      parameters:
        - name: columnId
          in: query
          schema:
            type: string
            format: uuid
        - name: assigneeId
          in: query
          schema:
            type: string
            format: uuid
        - name: dueBefore
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Tasks visible to the current board member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
    post:
      tags: [Tasks]
      summary: Create a top-level task
      operationId: createBoardTask
      description: Owner/Admin only. Members cannot create top-level tasks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'

  /api/v1/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: Get task detail
      operationId: getTask
      responses:
        '200':
          description: Task detail including visible subtasks and comments summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
    patch:
      tags: [Tasks]
      summary: Update an existing task
      operationId: updateTask
      description: >-
        Owner/Admin may edit any task. A Member may edit only the assigned
        task and only permitted content fields; assignment changes are
        Owner/Admin-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPatch'
      responses:
        '200':
          description: Task updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          description: Optimistic-lock conflict; reload and retry.
    delete:
      tags: [Tasks]
      summary: Delete a top-level task
      operationId: deleteTask
      description: Owner/Admin only.
      responses:
        '204':
          description: Task deleted.
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /api/v1/tasks/{taskId}/move:
    post:
      tags: [Tasks]
      summary: Move a task to a board column and position
      operationId: moveTask
      description: Owner/Admin may move any task; Member may move only their assigned task.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveTaskRequest'
      responses:
        '200':
          description: Task moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '409':
          description: Optimistic-lock conflict; reload and retry.

  /api/v1/tasks/{taskId}/subtasks:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Subtasks]
      summary: List subtasks
      operationId: listTaskSubtasks
      responses:
        '200':
          description: Ordered subtasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubTask'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
    post:
      tags: [Subtasks]
      summary: Add a subtask
      operationId: createTaskSubtask
      description: Owner/Admin may add subtasks to any task; Member may add them only to their assigned task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubTaskRequest'
      responses:
        '201':
          description: Subtask created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubTask'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'

  /api/v1/subtasks/{subtaskId}:
    parameters:
      - $ref: '#/components/parameters/SubTaskId'
    patch:
      tags: [Subtasks]
      summary: Edit or complete/reopen a subtask
      operationId: updateSubtask
      description: Owner/Admin may manage any subtask; Member may manage subtasks only on their assigned task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubTaskPatch'
      responses:
        '200':
          description: Subtask updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubTask'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
    delete:
      tags: [Subtasks]
      summary: Delete a subtask
      operationId: deleteSubtask
      description: Owner/Admin may delete any subtask; Member may delete subtasks only on their assigned task.
      responses:
        '204':
          description: Subtask deleted.
        '403':
          $ref: '#/components/responses/ForbiddenProblem'

  /api/v1/tasks/{taskId}/comments:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Comments]
      summary: List comments visible on a task
      operationId: listTaskComments
      responses:
        '200':
          description: Comments in chronological order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
    post:
      tags: [Comments]
      summary: Add a comment to any task visible in the board
      operationId: createTaskComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'

  /api/v1/calendar/tasks:
    get:
      tags: [Calendar]
      summary: Aggregate due tasks from boards accessible to the current user
      operationId: listCalendarTasks
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: boardId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Due tasks within the requested interval; tasks remain owned by their boards.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarTask'
        '400':
          $ref: '#/components/responses/ValidationProblem'

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List persisted in-app notifications
      operationId: listNotifications
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Notifications for the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/UnauthorizedProblem'

  /api/v1/notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      summary: Mark a notification as read
      operationId: markNotificationRead
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '204':
          description: Notification marked read.
        '404':
          $ref: '#/components/responses/NotFoundProblem'

  /api/v1/boards/{boardId}/activity:
    get:
      tags: [Activity]
      summary: List board activity visible to a board member
      operationId: listBoardActivity
      parameters:
        - $ref: '#/components/parameters/BoardId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Board activity, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  headers:
    RefreshCookie:
      schema:
        type: string
      description: HttpOnly, Secure, SameSite refresh cookie; rotated on refresh.
  parameters:
    BoardId:
      name: boardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ColumnId:
      name: columnId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TagId:
      name: tagId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubTaskId:
      name: subtaskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    ValidationProblem:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ConflictProblem:
      description: Request conflicts with current state or a uniqueness constraint.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnauthorizedProblem:
      description: Authentication is missing, invalid, or expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ForbiddenProblem:
      description: Authenticated principal lacks the required permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFoundProblem:
      description: Resource does not exist or is not visible to the current principal.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimitProblem:
      description: Request rate limit exceeded.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, username, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        username:
          type: string
          minLength: 3
          maxLength: 40
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Username or email address.
        password:
          type: string
          format: password
    AuthSession:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          const: 900
        user:
          $ref: '#/components/schemas/UserProfile'
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    PasswordResetSubmit:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    UserProfile:
      type: object
      required: [id, name, username, email, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
    ProfilePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        username:
          type: string
          minLength: 3
          maxLength: 40
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    BoardMode:
      type: string
      enum: [PERSONAL, COLLABORATIVE]
    BoardRole:
      type: string
      enum: [OWNER, ADMIN, MEMBER]
    BoardSummary:
      type: object
      required: [id, name, mode, role, taskCount, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mode:
          $ref: '#/components/schemas/BoardMode'
        role:
          $ref: '#/components/schemas/BoardRole'
        themeColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        taskCount:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
    BoardPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BoardSummary'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
    CreateBoardRequest:
      type: object
      additionalProperties: false
      required: [name, mode]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        mode:
          $ref: '#/components/schemas/BoardMode'
        themeColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
    BoardPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        mode:
          type: string
          enum: [COLLABORATIVE]
        themeColor:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
    BoardDetail:
      allOf:
        - $ref: '#/components/schemas/BoardSummary'
        - type: object
          required: [description, columns, members]
          properties:
            description:
              type: string
            columns:
              type: array
              items:
                $ref: '#/components/schemas/BoardColumn'
            members:
              type: array
              items:
                $ref: '#/components/schemas/BoardMember'
            tags:
              type: array
              items:
                $ref: '#/components/schemas/Tag'
            themeColor:
              type: string
              pattern: '^#[0-9A-Fa-f]{6}$'
            version:
              type: integer
    BoardMember:
      type: object
      required: [userId, name, username, role, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/BoardRole'
        joinedAt:
          type: string
          format: date-time
    ChangeMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [ADMIN, MEMBER]
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, MEMBER]
          default: MEMBER
    Invitation:
      type: object
      required: [id, boardId, boardName, inviterName, role, status, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        boardName:
          type: string
        inviterName:
          type: string
        role:
          type: string
          enum: [ADMIN, MEMBER]
        status:
          type: string
          enum: [PENDING, ACCEPTED, DECLINED, EXPIRED, REVOKED]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    BoardColumn:
      type: object
      required: [id, boardId, name, position]
      properties:
        id:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 80
        position:
          type: integer
        version:
          type: integer
    CreateColumnRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    ReorderColumnsRequest:
      type: object
      additionalProperties: false
      required: [columnIds, expectedBoardVersion]
      properties:
        columnIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        expectedBoardVersion:
          type: integer
          minimum: 0
    Task:
      type: object
      required: [id, boardId, columnId, title, position, tags, subtaskProgress, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        columnId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        assignee:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        dueAt:
          type:
            - string
            - 'null'
          format: date-time
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        subtasks:
          type: array
          items:
            $ref: '#/components/schemas/SubTask'
        subtaskProgress:
          $ref: '#/components/schemas/SubTaskProgress'
        position:
          type: integer
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [columnId, title]
      properties:
        columnId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        assigneeId:
          type: string
          format: uuid
        dueAt:
          type: string
          format: date-time
        tagIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    TaskPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        dueAt:
          type:
            - string
            - 'null'
          format: date-time
        tagIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        assigneeId:
          type:
            - string
            - 'null'
          format: uuid
        expectedVersion:
          type: integer
          minimum: 0
    MoveTaskRequest:
      type: object
      additionalProperties: false
      required: [columnId, position, expectedVersion]
      properties:
        columnId:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
        expectedVersion:
          type: integer
          minimum: 0
    UserSummary:
      type: object
      required: [id, name, username]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        username:
          type: string
        avatarUrl:
          type: string
          format: uri
    Tag:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 40
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
    CreateTagRequest:
      type: object
      additionalProperties: false
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
    TagPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
    SubTask:
      type: object
      required: [id, taskId, title, position, completed, version]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        title:
          type: string
        position:
          type: integer
        completed:
          type: boolean
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
        version:
          type: integer
    SubTaskProgress:
      type: object
      required: [completed, total]
      properties:
        completed:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    CreateSubTaskRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
    SubTaskPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        completed:
          type: boolean
        expectedVersion:
          type: integer
          minimum: 0
    Comment:
      type: object
      required: [id, taskId, author, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/UserSummary'
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateCommentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
    CalendarTask:
      type: object
      required: [task, boardName, columnName]
      properties:
        task:
          $ref: '#/components/schemas/Task'
        boardName:
          type: string
        columnName:
          type: string
    Notification:
      type: object
      required: [id, type, title, createdAt, read]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [TASK_OVERDUE, TASK_ASSIGNED, BOARD_INVITATION, BOARD_ACTIVITY]
        title:
          type: string
        body:
          type: string
        boardId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
    NotificationPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
    BoardActivity:
      type: object
      required: [id, boardId, actor, action, createdAt]
      properties:
        id:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        actor:
          $ref: '#/components/schemas/UserSummary'
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
          format: uuid
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    ActivityPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BoardActivity'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
