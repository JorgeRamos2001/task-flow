name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  api-contract:
    name: Validate API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Lint OpenAPI
        run: npm exec --yes --package=@redocly/cli@2.60.0 -- redocly lint docs/api/openapi.yaml

  frontend:
    name: Build and test Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-flow-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: task-flow-frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  backend:
    name: Verify Spring Boot API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-flow-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw --batch-mode verify
